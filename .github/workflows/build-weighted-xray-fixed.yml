name: Build patched Xray weighted balancer

on:
  workflow_dispatch:
    inputs:
      xray_source:
        description: "Choose Xray source"
        required: true
        default: "main"
        type: choice
        options:
          - main
          - latest-release
          - latest-prerelease
          - custom

      custom_ref:
        description: "Only used when xray_source=custom: branch / tag / commit SHA"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  resolve-xray:
    name: Resolve Xray source
    runs-on: ubuntu-latest

    outputs:
      source: ${{ steps.resolve.outputs.source }}
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      describe: ${{ steps.meta.outputs.describe }}

    steps:
      - name: Resolve requested Xray ref
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          XRAY_SOURCE: ${{ inputs.xray_source }}
          CUSTOM_REF: ${{ inputs.custom_ref }}
        run: |
          set -euo pipefail

          api_get() {
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$1"
          }

          case "${XRAY_SOURCE}" in
            main)
              REF="main"
              ;;

            latest-release)
              # Latest published stable release. GitHub's /releases/latest
              # excludes drafts and prereleases.
              REF="$(
                api_get "https://api.github.com/repos/XTLS/Xray-core/releases/latest" \
                  | jq -r '.tag_name // empty'
              )"
              ;;

            latest-prerelease)
              # Pick the newest published prerelease by created_at.
              # Do not rely on the API response ordering.
              REF="$(
                api_get "https://api.github.com/repos/XTLS/Xray-core/releases?per_page=100" \
                  | jq -r '[.[] | select(.draft == false and .prerelease == true)] | sort_by(.created_at) | last | .tag_name // empty'
              )"
              ;;

            custom)
              REF="${CUSTOM_REF}"
              if [ -z "${REF}" ]; then
                echo "::error::xray_source=custom requires custom_ref."
                exit 1
              fi
              ;;

            *)
              echo "::error::Unknown xray_source: ${XRAY_SOURCE}"
              exit 1
              ;;
          esac

          if [ -z "${REF}" ] || [ "${REF}" = "null" ]; then
            echo "::error::Failed to resolve Xray ref for source '${XRAY_SOURCE}'."
            exit 1
          fi

          echo "source=${XRAY_SOURCE}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Source mode : ${XRAY_SOURCE}"
          echo "Resolved ref: ${REF}"
          echo "========================================"

      - name: Checkout upstream Xray-core
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: ${{ steps.resolve.outputs.ref }}
          path: xray-core
          fetch-depth: 0

      - name: Resolve exact commit
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHA="$(git -C xray-core rev-parse HEAD)"
          SHORT_SHA="$(git -C xray-core rev-parse --short=7 HEAD)"
          DESCRIBE="$(git -C xray-core describe --tags --always --dirty)"

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "describe=${DESCRIBE}" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "Source mode : ${{ steps.resolve.outputs.source }}"
          echo "Resolved ref: ${{ steps.resolve.outputs.ref }}"
          echo "Exact SHA   : ${SHA}"
          echo "Short SHA   : ${SHORT_SHA}"
          echo "Describe    : ${DESCRIBE}"
          echo "========================================"

          git -C xray-core log -1 --oneline

  patch-test-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: resolve-xray
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""

          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""

          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"

          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""

          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""

    steps:
      # Checkout WXMa1/myxray to obtain scripts/patch_weighted_balancer.py.
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      # Every matrix entry uses the exact same upstream commit SHA.
      - name: Checkout exact upstream Xray-core commit
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: ${{ needs.resolve-xray.outputs.sha }}
          path: xray-core
          fetch-depth: 0

      - name: Show source information
        shell: bash
        run: |
          echo "========================================"
          echo "Source mode : ${{ needs.resolve-xray.outputs.source }}"
          echo "Resolved ref: ${{ needs.resolve-xray.outputs.ref }}"
          echo "Exact SHA   : ${{ needs.resolve-xray.outputs.sha }}"
          echo "Short SHA   : ${{ needs.resolve-xray.outputs.short_sha }}"
          echo "Describe    : ${{ needs.resolve-xray.outputs.describe }}"
          echo "========================================"

          git -C xray-core log -1 --oneline

      # Follow the Go version declared by upstream Xray-core.
      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Apply weighted balancer patch
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          python3 ../patch-repo/scripts/patch_weighted_balancer.py

      - name: Verify patch
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail

          echo "===== git diff --check ====="
          git diff --check

          echo
          echo "===== git status ====="
          git status --short

          echo
          echo "===== weightedRoundRobin references ====="
          grep -Rni \
            --exclude='*.pb.go' \
            "weightedRoundRobin" \
            app/router infra/conf || true

          echo
          echo "===== Patch diff ====="
          git diff -- \
            app/router/config.go \
            app/router/strategy_weightedroundrobin.go \
            app/router/strategy_weightedroundrobin_test.go \
            infra/conf/router.go \
            infra/conf/router_strategy.go

      - name: Download Go dependencies
        working-directory: xray-core
        run: go mod download

      # Xray's existing router/conf tests require geoip.dat and geosite.dat.
      # Only linux/amd64 runs the tests, so only that matrix entry downloads them.
      - name: Prepare geodata for unit tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p resources
          BASE="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release"

          for name in geoip geosite; do
            echo "Downloading ${name}.dat"

            curl -fL \
              --retry 5 \
              --retry-delay 2 \
              "${BASE}/${name}.dat" \
              -o "resources/${name}.dat"

            echo "Downloading ${name}.dat.sha256sum"

            curl -fL \
              --retry 5 \
              --retry-delay 2 \
              "${BASE}/${name}.dat.sha256sum" \
              -o "resources/${name}.dat.sha256sum"
          done

          echo
          echo "===== Verify geodata SHA256 ====="

          (
            cd resources
            sha256sum -c geoip.dat.sha256sum
            sha256sum -c geosite.dat.sha256sum
          )

      # Run the full affected upstream test packages once.
      - name: Unit tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        run: |
          go test \
            -timeout 1h \
            ./app/router \
            ./infra/conf

      - name: Build Xray
        working-directory: xray-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          COMMID="$(git describe --always --dirty)"
          OUTPUT="dist/xray-${{ matrix.suffix }}${{ matrix.ext }}"

          echo "========================================"
          echo "Building Xray"
          echo "Source   : ${{ needs.resolve-xray.outputs.source }}"
          echo "Ref      : ${{ needs.resolve-xray.outputs.ref }}"
          echo "GOOS     : ${GOOS}"
          echo "GOARCH   : ${GOARCH}"
          echo "Build ID : ${COMMID}"
          echo "Output   : ${OUTPUT}"
          echo "========================================"

          go build \
            -o "$OUTPUT" \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main

          echo
          echo "===== SHA256 ====="

          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"
          cat "${OUTPUT}.sha256"

          echo
          echo "===== Build result ====="
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xray-weighted-${{ matrix.suffix }}-${{ needs.resolve-xray.outputs.short_sha }}
          path: |
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}.sha256
          if-no-files-found: error
          compression-level: 9
