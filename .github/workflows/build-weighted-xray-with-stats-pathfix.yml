name: Build patched Xray WRR + selection stats

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: "XTLS/Xray-core branch, tag, or commit (d562d89 is the XRAY-WRB known-good baseline)"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  # Safety rail: always prove the new patcher still preserves the exact
  # XRAY-WRB known-good WRR baseline before building the user-selected ref.
  baseline-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Locate patch script
        id: patcher
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer_with_stats.py"
            "$GITHUB_WORKSPACE/patch-repo/patch_weighted_balancer_with_stats.py"
          )

          for p in "${candidates[@]}"; do
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "Using patcher: $p"
              exit 0
            fi
          done

          mapfile -t found < <(find "$GITHUB_WORKSPACE/patch-repo" -maxdepth 5 -type f -name 'patch_weighted_balancer_with_stats.py' -print)
          if [ "${#found[@]}" -eq 1 ]; then
            echo "path=${found[0]}" >> "$GITHUB_OUTPUT"
            echo "Using discovered patcher: ${found[0]}"
            exit 0
          fi

          echo "ERROR: could not locate patch_weighted_balancer_with_stats.py"
          echo "Repository files:"
          find "$GITHUB_WORKSPACE/patch-repo" -maxdepth 4 -type f -print | sort
          exit 1

      - name: Checkout Xray repository for known-good baseline
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          path: xray-core
          fetch-depth: 0

      - name: Resolve known-good baseline commit
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse --verify 'd562d89^{commit}'
          git checkout --detach "$(git rev-parse 'd562d89^{commit}')"
          echo "known-good baseline: $(git rev-parse HEAD)"

      - name: Set up Go from baseline go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Apply WRR + native selection-counter patch to baseline
        working-directory: xray-core
        run: python3 "${{ steps.patcher.outputs.path }}"

      - name: Verify baseline patch is idempotent
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/wrr-baseline-first.patch
          python3 "${{ steps.patcher.outputs.path }}"
          git diff --binary > /tmp/wrr-baseline-second.patch
          cmp /tmp/wrr-baseline-first.patch /tmp/wrr-baseline-second.patch
          git diff --check

      - name: Run known-good WRR compatibility tests
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go test ./app/router ./infra/conf
          go test ./app/router -run 'TestWeightedRoundRobinStrategy' -count=1 -v
          go vet ./app/router ./infra/conf

      - name: Build known-good linux/amd64 baseline
        working-directory: xray-core
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          go build -o /tmp/xray-baseline -trimpath -buildvcs=false -ldflags='-s -w -buildid=' ./main
          /tmp/xray-baseline version

  patch-test-build:
    needs: baseline-compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Locate patch script
        id: patcher
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer_with_stats.py"
            "$GITHUB_WORKSPACE/patch-repo/patch_weighted_balancer_with_stats.py"
          )

          for p in "${candidates[@]}"; do
            if [ -f "$p" ]; then
              echo "path=$p" >> "$GITHUB_OUTPUT"
              echo "Using patcher: $p"
              exit 0
            fi
          done

          mapfile -t found < <(find "$GITHUB_WORKSPACE/patch-repo" -maxdepth 5 -type f -name 'patch_weighted_balancer_with_stats.py' -print)
          if [ "${#found[@]}" -eq 1 ]; then
            echo "path=${found[0]}" >> "$GITHUB_OUTPUT"
            echo "Using discovered patcher: ${found[0]}"
            exit 0
          fi

          echo "ERROR: could not locate patch_weighted_balancer_with_stats.py"
          echo "Repository files:"
          find "$GITHUB_WORKSPACE/patch-repo" -maxdepth 4 -type f -print | sort
          exit 1

      - name: Checkout upstream Xray-core
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          path: xray-core
          fetch-depth: 0

      - name: Resolve requested Xray ref
        working-directory: xray-core
        shell: bash
        env:
          XRAY_REF: ${{ inputs.xray_ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          resolve_ref() {
            local ref="$1"
            local target=""

            if git rev-parse --verify --quiet "${ref}^{commit}" >/dev/null; then
              target="$(git rev-parse "${ref}^{commit}")"
            elif git rev-parse --verify --quiet "origin/${ref}^{commit}" >/dev/null; then
              target="$(git rev-parse "origin/${ref}^{commit}")"
            else
              git fetch --force origin "$ref"
              target="$(git rev-parse 'FETCH_HEAD^{commit}')"
            fi

            printf '%s\n' "$target"
          }

          TARGET="$(resolve_ref "$XRAY_REF")"
          git checkout --detach "$TARGET"
          echo "requested_ref=$XRAY_REF"
          echo "resolved_commit=$(git rev-parse HEAD)"

      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Record exact upstream revision
        id: upstream
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          git show -s --format='upstream=%H %cI %s'

      - name: Apply WRR + native selection-counter patch
        working-directory: xray-core
        run: python3 "${{ steps.patcher.outputs.path }}"

      - name: Verify patch is idempotent
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/wrr-first.patch
          python3 "${{ steps.patcher.outputs.path }}"
          git diff --binary > /tmp/wrr-second.patch
          cmp /tmp/wrr-first.patch /tmp/wrr-second.patch

      - name: Verify compatibility diff and formatting
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff -- \
            app/router/config.go \
            app/router/strategy_weightedroundrobin.go \
            app/router/strategy_weightedroundrobin_test.go \
            infra/conf/router.go \
            infra/conf/router_strategy.go

      - name: Download dependencies
        working-directory: xray-core
        run: go mod download

      # Tests run once on linux/amd64. They include the original validated WRR
      # 5:3:2 / zero-weight behavior plus the new Stats counter assertions.
      - name: WRR regression and selection-counter tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          go test ./app/router ./infra/conf
          go test ./app/router -run 'TestWeightedRoundRobinStrategy' -count=1 -v
          go vet ./app/router ./infra/conf

      - name: Build Xray
        working-directory: xray-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMID="$(git describe --always --dirty)"
          OUTPUT="dist/xray-${{ matrix.suffix }}${{ matrix.ext }}"
          go build \
            -o "$OUTPUT" \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Native config parse smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrr-selection-stats-smoke.json <<'JSON'
          {
            "log": {"loglevel": "warning"},
            "stats": {},
            "routing": {
              "rules": [
                {"type": "field", "network": "tcp,udp", "balancerTag": "wrr-smoke"}
              ],
              "balancers": [
                {
                  "tag": "wrr-smoke",
                  "selector": ["smoke-"],
                  "strategy": {
                    "type": "weightedRoundRobin",
                    "settings": {
                      "weights": [
                        {"regexp": false, "match": "smoke-a", "value": 5},
                        {"regexp": false, "match": "smoke-b", "value": 3},
                        {"regexp": false, "match": "smoke-c", "value": 2}
                      ]
                    }
                  }
                }
              ]
            },
            "inbounds": [
              {"tag": "in", "listen": "127.0.0.1", "port": 18080, "protocol": "socks", "settings": {"udp": true}}
            ],
            "outbounds": [
              {"tag": "smoke-a", "protocol": "freedom"},
              {"tag": "smoke-b", "protocol": "freedom"},
              {"tag": "smoke-c", "protocol": "freedom"}
            ]
          }
          JSON
          "dist/xray-${{ matrix.suffix }}${{ matrix.ext }}" run -test -c /tmp/wrr-selection-stats-smoke.json

      - name: Write build provenance
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          cat > "dist/xray-${{ matrix.suffix }}.build-info.txt" <<EOF
          upstream_ref=${{ inputs.xray_ref }}
          upstream_commit=${{ steps.upstream.outputs.commit }}
          patch=weightedRoundRobin+native-selection-stats
          counter=outbound>>><tag>>>>wrr>>>selections
          EOF

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-weighted-stats-${{ matrix.suffix }}-${{ steps.upstream.outputs.short }}
          path: |
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}.sha256
            xray-core/dist/xray-${{ matrix.suffix }}.build-info.txt
          if-no-files-found: error
