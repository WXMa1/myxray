
# ============================================================
# Xray-core + WRR + Selection Stats + AnyTLS
# V5 - Fix GeoData missing during Linux AMD64 routing tests
# ============================================================

name: Build Xray with WRR + Selection Stats + AnyTLS

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: 'XTLS/Xray-core ref'
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  build-combined:
    name: Combined / ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, suffix: linux-amd64,   ext: '' }
          - { goos: linux,   goarch: arm64, suffix: linux-arm64,   ext: '' }
          - { goos: windows, goarch: amd64, suffix: windows-amd64, ext: '.exe' }
          - { goos: darwin,  goarch: amd64, suffix: darwin-amd64,  ext: '' }
          - { goos: darwin,  goarch: arm64, suffix: darwin-arm64,  ext: '' }

    steps:

      # ======================================================
      # 1. Checkout repositories
      # ======================================================

      - name: Checkout original WRR patch repository
        uses: actions/checkout@v4
        with:
          path: patch-repo
          persist-credentials: false

      - name: Checkout official Xray-core
        uses: actions/checkout@v4
        with:
          repository: XTLS/Xray-core
          ref: ${{ inputs.xray_ref }}
          path: xray-core
          persist-credentials: false

      - name: Checkout pinned AnyTLS implementation
        uses: actions/checkout@v4
        with:
          repository: ynetlab/Xray-core
          ref: 0721f9b543a6c20f503c1ac181eeb27d98d808f2
          path: anytls-source
          persist-credentials: false

      # ======================================================
      # 2. Verify revisions
      # ======================================================

      - name: Check source revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail

          expected='0721f9b543a6c20f503c1ac181eeb27d98d808f2'
          actual="$(git -C anytls-source rev-parse HEAD)"

          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: AnyTLS commit mismatch"
            exit 1
          fi

          upstream="$(git -C xray-core rev-parse HEAD)"

          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "upstream_short=${upstream:0:12}" >> "$GITHUB_OUTPUT"

          echo "Xray upstream: $upstream"
          echo "WRR patch repo: $(git -C patch-repo rev-parse HEAD)"
          echo "AnyTLS commit: $actual"

      # ======================================================
      # 3. Verify WRR patch script
      # ======================================================

      - name: Verify original WRR patch script
        shell: bash
        run: |
          set -euo pipefail

          script="$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer_with_stats.py"

          if [[ ! -f "$script" ]]; then
            echo "ERROR: WRR patch script missing: $script"
            find patch-repo -maxdepth 3 -type f | head -60
            exit 1
          fi

          python3 -m py_compile "$script"

          echo "WRR patch script found."

      # ======================================================
      # 4. Apply WRR + Selection Stats
      # ======================================================

      - name: Apply original WRR + native selection-counter patch
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying WRR + Selection Stats patch..."

          # Must run inside the Xray-core source root.
          (
            cd "$GITHUB_WORKSPACE/xray-core"

            test -f go.mod

            python3 "$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer_with_stats.py"
          )

          echo "WRR patch execution completed."

          git -C xray-core add -N .
          git -C xray-core diff --check

          git -C xray-core diff \
            --no-ext-diff \
            --unified=0 \
            > "$GITHUB_WORKSPACE/wrr-change.patch"

          git -C xray-core diff --name-only \
            > "$GITHUB_WORKSPACE/wrr-changed-files.txt"

          if [[ ! -s "$GITHUB_WORKSPACE/wrr-changed-files.txt" ]]; then
            echo "ERROR: WRR patch produced no changes."
            exit 1
          fi

          # Verify WRR markers.
          if ! grep -Eiq \
            'weighted|wrr|round.?robin' \
            "$GITHUB_WORKSPACE/wrr-change.patch"; then

            echo "ERROR: WRR changes not detected."
            exit 1
          fi

          # Verify Selection Stats markers.
          if ! grep -Eiq \
            'selection.{0,80}(stat|count)|(stat|count).{0,80}selection' \
            "$GITHUB_WORKSPACE/wrr-change.patch"; then

            echo "ERROR: Selection Stats changes not detected."
            exit 1
          fi

          {
            echo "wrr_patch_script=scripts/patch_weighted_balancer_with_stats.py"

            echo "wrr_patch_commit=$(git -C "$GITHUB_WORKSPACE/patch-repo" rev-parse HEAD)"

            echo "wrr_diff_markers=verified"
            echo "selection_stats_diff_markers=verified"

            echo "changed_files:"
            cat "$GITHUB_WORKSPACE/wrr-changed-files.txt"

          } > "$GITHUB_WORKSPACE/wrr-validation.txt"

          cat "$GITHUB_WORKSPACE/wrr-validation.txt"

      # ======================================================
      # 5. Apply AnyTLS implementation
      # ======================================================

      - name: Add AnyTLS to WRR-patched Xray
        shell: bash
        run: |
          set -euo pipefail

          echo "Applying AnyTLS patch..."

          test -f anytls-source/infra/conf/anytls.go
          test -f anytls-source/proxy/anytls/config.pb.go

          if [[ -e xray-core/proxy/anytls || -e xray-core/infra/conf/anytls.go ]]; then
            echo "ERROR: Xray already contains AnyTLS."
            exit 1
          fi

          cp -a \
            anytls-source/proxy/anytls \
            xray-core/proxy/anytls

          cp \
            anytls-source/infra/conf/anytls.go \
            xray-core/infra/conf/anytls.go

          python3 - <<'PY'
          from pathlib import Path

          # Register AnyTLS inbound and outbound.
          config = Path('xray-core/infra/conf/xray.go')

          text = config.read_text(encoding='utf-8')

          edits = [
              (
                  'inboundConfigLoader = NewJSONConfigLoader(ConfigCreatorCache{',
                  '\n\t\t"anytls": func() interface{} { return new(AnyTLSServerConfig) },',
              ),
              (
                  'outboundConfigLoader = NewJSONConfigLoader(ConfigCreatorCache{',
                  '\n\t\t"anytls": func() interface{} { return new(AnyTLSClientConfig) },',
              ),
          ]

          for anchor, addition in edits:
              if text.count(anchor) != 1:
                  raise SystemExit(
                      f'ERROR: Xray registration anchor changed: {anchor}'
                  )

              text = text.replace(anchor, anchor + addition, 1)

          config.write_text(text, encoding='utf-8')

          # Register the AnyTLS runtime implementation.
          imports = Path('xray-core/main/distro/all/all.go')

          text = imports.read_text(encoding='utf-8')

          anchor = '_ "github.com/xtls/xray-core/proxy/blackhole"'

          if text.count(anchor) != 1:
              raise SystemExit(
                  'ERROR: Xray distro import anchor changed'
              )

          text = text.replace(
              anchor,
              '_ "github.com/xtls/xray-core/proxy/anytls"\n\t' + anchor,
              1
          )

          imports.write_text(text, encoding='utf-8')
          PY

          cd xray-core

          gofmt -w \
            infra/conf/xray.go \
            infra/conf/anytls.go \
            main/distro/all/all.go \
            proxy/anytls/*.go

          git add -N infra/conf/anytls.go proxy/anytls

          git diff --check

          echo "AnyTLS source files applied."
          git diff --stat

      # ======================================================
      # 6. Setup Go
      # ======================================================

      - name: Set up Go from Xray go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: xray-core/go.mod
          cache: true
          cache-dependency-path: xray-core/go.sum

      # ======================================================
      # 7. Download GeoData and run Go tests
      #
      # V5 FIX:
      # Xray routing tests require resources/geosite.dat.
      # Download the official GeoData and verify SHA256.
      #
      # Tests run on Linux AMD64 only.
      # ======================================================

      - name: Download GeoData and test AnyTLS + WRR + routing
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading official Xray GeoData"
          echo "========================================"

          mkdir -p resources

          BASE_URL="https://github.com/XTLS/Xray-rules-dat/releases/latest/download"

          # Download GeoSite standard database.
          curl -fL --retry 3 \
            "$BASE_URL/geosite.dat" \
            -o resources/geosite.dat

          curl -fL --retry 3 \
            "$BASE_URL/geosite.dat.sha256sum" \
            -o resources/geosite.dat.sha256sum

          # Download GeoIP Lite database.
          curl -fL --retry 3 \
            "$BASE_URL/geoip-lite.dat" \
            -o resources/geoip-lite.dat

          curl -fL --retry 3 \
            "$BASE_URL/geoip-lite.dat.sha256sum" \
            -o resources/geoip-lite.dat.sha256sum

          echo "========================================"
          echo "Verifying GeoData SHA256"
          echo "========================================"

          (
            cd resources

            # Verify original filenames first.
            sha256sum -c geosite.dat.sha256sum
            sha256sum -c geoip-lite.dat.sha256sum

            # Rename GeoIP Lite to the filename Xray expects.
            mv geoip-lite.dat geoip.dat
          )

          test -s resources/geosite.dat
          test -s resources/geoip.dat

          echo "GeoData download and verification successful."

          ls -lh resources/geosite.dat resources/geoip.dat

          echo "========================================"
          echo "Downloading Go dependencies"
          echo "========================================"

          go mod download

          echo "========================================"
          echo "Testing AnyTLS package"
          echo "========================================"

          go test ./proxy/anytls -count=1

          echo "========================================"
          echo "Testing WRR + Selection Stats + routing"
          echo "========================================"

          go test ./app/router -count=1

          echo "========================================"
          echo "All Go tests passed"
          echo "========================================"

      # ======================================================
      # 8. Build binaries
      # ======================================================

      - name: Compile Xray with WRR + Stats + AnyTLS
        working-directory: xray-core
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          XRAY_REF: ${{ inputs.xray_ref }}
        run: |
          set -euo pipefail

          echo "Building for $GOOS/$GOARCH"

          mkdir -p dist

          binary="dist/xray-wrr-anytls-${{ matrix.suffix }}${{ matrix.ext }}"

          go build \
            -trimpath \
            -buildvcs=false \
            -ldflags='-s -w -buildid=' \
            -o "$binary" \
            ./main

          sha256sum "$binary" > "$binary.sha256"

          # Record source revision information.
          {
            echo "upstream_repo=XTLS/Xray-core"
            echo "upstream_ref=$XRAY_REF"
            echo "upstream_commit=${{ steps.revisions.outputs.upstream }}"

            echo "anytls_source_repo=ynetlab/Xray-core"
            echo "anytls_source_commit=0721f9b543a6c20f503c1ac181eeb27d98d808f2"

            echo "wrr_patch=patch-repo/scripts/patch_weighted_balancer_with_stats.py"
            echo "selection_stats=source_diff_verified"

            echo "wrr_patch_commit=$(git -C ../patch-repo rev-parse HEAD)"

            cat ../wrr-validation.txt

          } > "dist/build-info-${{ matrix.suffix }}.txt"

          echo "Build completed: $binary"

      # ======================================================
      # 9. Smoke-test AnyTLS configuration
      # ======================================================

      - name: Smoke-test AnyTLS outbound config
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking compiled Xray version..."

          dist/xray-wrr-anytls-linux-amd64 version

          echo "Creating AnyTLS test configuration..."

          cat > /tmp/anytls-client-test.json <<'JSON'
          {
            "log": {
              "loglevel": "warning"
            },
            "outbounds": [
              {
                "protocol": "anytls",
                "settings": {
                  "address": "example.com",
                  "port": 443,
                  "password": "ci-test-only-password"
                },
                "streamSettings": {
                  "network": "tcp",
                  "security": "tls",
                  "tlsSettings": {
                    "serverName": "example.com"
                  }
                }
              }
            ]
          }
          JSON

          dist/xray-wrr-anytls-linux-amd64 \
            run -test \
            -c /tmp/anytls-client-test.json

          echo "AnyTLS outbound configuration validation passed."

      # ======================================================
      # 10. Upload artifacts
      # ======================================================

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-wrr-anytls-${{ matrix.suffix }}-${{ steps.revisions.outputs.upstream_short }}
          path: |
            wrr-validation.txt
            xray-core/dist/xray-wrr-anytls-${{ matrix.suffix }}${{ matrix.ext }}
            xray-core/dist/xray-wrr-anytls-${{ matrix.suffix }}${{ matrix.ext }}.sha256
            xray-core/dist/build-info-${{ matrix.suffix }}.txt
          if-no-files-found: error
          retention-days: 14
