name: Build patched Xray WRR + selection stats

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: "XTLS/Xray-core branch, tag, or commit (d562d89 is the XRAY-WRB known-good baseline)"
        required: true
        default: "d562d89"
        type: string

permissions:
  contents: read

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Checkout upstream Xray-core
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: ${{ inputs.xray_ref }}
          path: xray-core
          fetch-depth: 0

      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Record exact upstream revision
        id: upstream
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          git show -s --format='upstream=%H %cI %s'

      - name: Apply WRR + native selection-counter patch
        working-directory: xray-core
        run: python3 ../patch-repo/scripts/patch_weighted_balancer_with_stats.py

      - name: Verify patch is idempotent
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/wrr-first.patch
          python3 ../patch-repo/scripts/patch_weighted_balancer_with_stats.py
          git diff --binary > /tmp/wrr-second.patch
          cmp /tmp/wrr-first.patch /tmp/wrr-second.patch

      - name: Verify compatibility diff and formatting
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff -- \
            app/router/config.go \
            app/router/strategy_weightedroundrobin.go \
            app/router/strategy_weightedroundrobin_test.go \
            infra/conf/router.go \
            infra/conf/router_strategy.go

      - name: Download dependencies
        working-directory: xray-core
        run: go mod download

      # Tests run once on linux/amd64. They include the original validated WRR
      # 5:3:2 / zero-weight behavior plus the new Stats counter assertions.
      - name: WRR regression and selection-counter tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          go test ./app/router ./infra/conf
          go test ./app/router -run 'TestWeightedRoundRobinStrategy' -count=1 -v
          go vet ./app/router ./infra/conf

      - name: Build Xray
        working-directory: xray-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMID="$(git describe --always --dirty)"
          OUTPUT="dist/xray-${{ matrix.suffix }}${{ matrix.ext }}"
          go build \
            -o "$OUTPUT" \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Native config parse smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/wrr-selection-stats-smoke.json <<'JSON'
          {
            "log": {"loglevel": "warning"},
            "stats": {},
            "routing": {
              "rules": [
                {"type": "field", "network": "tcp,udp", "balancerTag": "wrr-smoke"}
              ],
              "balancers": [
                {
                  "tag": "wrr-smoke",
                  "selector": ["smoke-"],
                  "strategy": {
                    "type": "weightedRoundRobin",
                    "settings": {
                      "weights": [
                        {"regexp": false, "match": "smoke-a", "value": 5},
                        {"regexp": false, "match": "smoke-b", "value": 3},
                        {"regexp": false, "match": "smoke-c", "value": 2}
                      ]
                    }
                  }
                }
              ]
            },
            "inbounds": [
              {"tag": "in", "listen": "127.0.0.1", "port": 18080, "protocol": "socks", "settings": {"udp": true}}
            ],
            "outbounds": [
              {"tag": "smoke-a", "protocol": "freedom"},
              {"tag": "smoke-b", "protocol": "freedom"},
              {"tag": "smoke-c", "protocol": "freedom"}
            ]
          }
          JSON
          "dist/xray-${{ matrix.suffix }}${{ matrix.ext }}" run -test -c /tmp/wrr-selection-stats-smoke.json

      - name: Write build provenance
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          cat > "dist/xray-${{ matrix.suffix }}.build-info.txt" <<EOF
          upstream_ref=${{ inputs.xray_ref }}
          upstream_commit=${{ steps.upstream.outputs.commit }}
          patch=weightedRoundRobin+native-selection-stats
          counter=outbound>>><tag>>>>wrr>>>selections
          EOF

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-weighted-stats-${{ matrix.suffix }}-${{ steps.upstream.outputs.short }}
          path: |
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}.sha256
            xray-core/dist/xray-${{ matrix.suffix }}.build-info.txt
          if-no-files-found: error
