name: Build patched Xray weighted balancer

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: "XTLS/Xray-core branch, tag, or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Checkout upstream Xray-core
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          ref: ${{ inputs.xray_ref }}
          path: xray-core
          fetch-depth: 0

      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Apply weighted balancer patch
        working-directory: xray-core
        run: python3 ../patch-repo/scripts/patch_weighted_balancer.py

      - name: Verify patch and formatting
        working-directory: xray-core
        run: |
          git diff --check
          git status --short
          git diff -- app/router/config.go app/router/strategy_weightedroundrobin.go infra/conf/router.go infra/conf/router_strategy.go

      - name: Download dependencies
        working-directory: xray-core
        run: go mod download

      # Run tests once; matrix builds all targets after the same patch.
      - name: Unit tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        run: go test ./app/router ./infra/conf

      - name: Build Xray
        working-directory: xray-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMID="$(git describe --always --dirty)"
          OUTPUT="dist/xray-${{ matrix.suffix }}${{ matrix.ext }}"
          go build \
            -o "$OUTPUT" \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-weighted-${{ matrix.suffix }}
          path: |
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}.sha256
          if-no-files-found: error
