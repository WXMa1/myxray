name: Build patched Xray WRR

on:
  workflow_dispatch:
    inputs:
      xray_ref:
        description: "XTLS/Xray-core branch, tag, full SHA, or short SHA"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  baseline-compat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Verify canonical patch layout
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer.py"
          test -f "$PATCHER" || {
            echo "ERROR: required patcher is missing: $PATCHER"
            echo "Expected repository layout:"
            echo "  scripts/patch_weighted_balancer.py"
            echo
            echo "Actual scripts directory:"
            ls -la "$GITHUB_WORKSPACE/patch-repo/scripts" || true
            exit 1
          }
          echo "Using canonical patcher: $PATCHER"


      - name: Checkout Xray repository for known-good baseline
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          path: xray-core
          fetch-depth: 0

      - name: Resolve known-good baseline commit
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          git rev-parse --verify 'd562d89^{commit}'
          git checkout --detach "$(git rev-parse 'd562d89^{commit}')"
          echo "known-good baseline: $(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Apply balancer-only WRR patch
        working-directory: xray-core
        run: python3 "$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer.py"

      - name: Prepare Xray geodata test assets
        working-directory: xray-core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p resources

          fetch_geodat() {
            local remote_name="$1"
            local local_name="$2"
            local base="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release"
            local expected

            echo "Resolving SHA256 for ${remote_name}.dat..."
            expected="$(
              curl --fail --silent --show-error --location \
                --retry 5 --retry-delay 2 --retry-all-errors \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${base}/${remote_name}.dat.sha256sum" \
              | awk 'NR==1 {print $1}'
            )"

            if ! [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "ERROR: invalid SHA256 metadata for ${remote_name}.dat: ${expected}"
              exit 1
            fi

            if [ -s "resources/${local_name}.dat" ]; then
              current="$(sha256sum "resources/${local_name}.dat" | awk '{print $1}')"
              if [ "$current" = "$expected" ]; then
                echo "resources/${local_name}.dat already matches ${expected}"
                return 0
              fi
            fi

            echo "Downloading ${remote_name}.dat..."
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${base}/${remote_name}.dat" \
              -o "resources/${local_name}.dat"

            echo "${expected}  resources/${local_name}.dat" | sha256sum -c -
          }

          fetch_geodat geoip geoip
          fetch_geodat geosite geosite
          ls -lh resources/geoip.dat resources/geosite.dat

      - name: Verify known-good baseline
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary > /tmp/first.patch
          python3 "$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer.py"
          git diff --binary > /tmp/second.patch
          cmp /tmp/first.patch /tmp/second.patch
          git diff --check
          go mod download
          go test ./app/router ./infra/conf
          go test ./app/router -run 'TestWeightedRoundRobinStrategy' -count=1 -v
          go vet ./app/router
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o /tmp/xray-baseline -trimpath -buildvcs=false -ldflags='-s -w -buildid=' ./main
          /tmp/xray-baseline version

  build:
    needs: baseline-compat
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux,   goarch: amd64, suffix: linux-amd64,   ext: ""}
          - {goos: linux,   goarch: arm64, suffix: linux-arm64,   ext: ""}
          - {goos: windows, goarch: amd64, suffix: windows-amd64, ext: ".exe"}
          - {goos: darwin,  goarch: amd64, suffix: darwin-amd64,  ext: ""}
          - {goos: darwin,  goarch: arm64, suffix: darwin-arm64,  ext: ""}

    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v7
        with:
          path: patch-repo

      - name: Verify canonical patch layout
        shell: bash
        run: |
          set -euo pipefail
          PATCHER="$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer.py"
          test -f "$PATCHER" || {
            echo "ERROR: required patcher is missing: $PATCHER"
            echo "Expected repository layout:"
            echo "  scripts/patch_weighted_balancer.py"
            echo
            echo "Actual scripts directory:"
            ls -la "$GITHUB_WORKSPACE/patch-repo/scripts" || true
            exit 1
          }
          echo "Using canonical patcher: $PATCHER"


      - name: Checkout upstream Xray-core
        uses: actions/checkout@v7
        with:
          repository: XTLS/Xray-core
          path: xray-core
          fetch-depth: 0

      - name: Resolve requested Xray ref
        working-directory: xray-core
        shell: bash
        env:
          XRAY_REF: ${{ inputs.xray_ref }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'

          if git rev-parse --verify --quiet "${XRAY_REF}^{commit}" >/dev/null; then
            TARGET="$(git rev-parse "${XRAY_REF}^{commit}")"
          elif git rev-parse --verify --quiet "origin/${XRAY_REF}^{commit}" >/dev/null; then
            TARGET="$(git rev-parse "origin/${XRAY_REF}^{commit}")"
          else
            git fetch --force origin "$XRAY_REF"
            TARGET="$(git rev-parse 'FETCH_HEAD^{commit}')"
          fi

          git checkout --detach "$TARGET"
          echo "requested_ref=$XRAY_REF"
          echo "resolved_commit=$(git rev-parse HEAD)"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: xray-core/go.mod
          check-latest: true
          cache: true
          cache-dependency-path: xray-core/go.sum

      - name: Record exact upstream revision
        id: upstream
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply balancer-only WRR patch
        working-directory: xray-core
        run: python3 "$GITHUB_WORKSPACE/patch-repo/scripts/patch_weighted_balancer.py"

      - name: Prepare Xray geodata test assets
        working-directory: xray-core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p resources

          fetch_geodat() {
            local remote_name="$1"
            local local_name="$2"
            local base="https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release"
            local expected

            echo "Resolving SHA256 for ${remote_name}.dat..."
            expected="$(
              curl --fail --silent --show-error --location \
                --retry 5 --retry-delay 2 --retry-all-errors \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${base}/${remote_name}.dat.sha256sum" \
              | awk 'NR==1 {print $1}'
            )"

            if ! [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "ERROR: invalid SHA256 metadata for ${remote_name}.dat: ${expected}"
              exit 1
            fi

            if [ -s "resources/${local_name}.dat" ]; then
              current="$(sha256sum "resources/${local_name}.dat" | awk '{print $1}')"
              if [ "$current" = "$expected" ]; then
                echo "resources/${local_name}.dat already matches ${expected}"
                return 0
              fi
            fi

            echo "Downloading ${remote_name}.dat..."
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${base}/${remote_name}.dat" \
              -o "resources/${local_name}.dat"

            echo "${expected}  resources/${local_name}.dat" | sha256sum -c -
          }

          fetch_geodat geoip geoip
          fetch_geodat geosite geosite
          ls -lh resources/geoip.dat resources/geosite.dat

      - name: Test WRR
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: xray-core
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          go mod download
          go test ./app/router ./infra/conf
          go test ./app/router -run 'TestWeightedRoundRobinStrategy' -count=1 -v
          go vet ./app/router

      - name: Build Xray
        working-directory: xray-core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMID="$(git describe --always --dirty)"
          OUTPUT="dist/xray-${{ matrix.suffix }}${{ matrix.ext }}"
          go build \
            -o "$OUTPUT" \
            -trimpath \
            -buildvcs=false \
            -gcflags="all=-l=4" \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -v ./main
          sha256sum "$OUTPUT" > "${OUTPUT}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: xray-weighted-${{ matrix.suffix }}-${{ steps.upstream.outputs.short }}
          path: |
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}
            xray-core/dist/xray-${{ matrix.suffix }}${{ matrix.ext }}.sha256
          if-no-files-found: error
